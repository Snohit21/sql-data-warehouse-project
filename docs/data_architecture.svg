<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="700" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">High level architecture</text>

  <!-- Sources -->
  <text x="100" y="100" font-size="18" font-weight="700" fill="#1a1a1a">Sources</text>
  <rect x="50" y="130" width="190" height="430" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 3" rx="6"/>
  <rect x="75" y="170" width="60" height="46" rx="4" fill="#FAC775" stroke="#BA7517"/>
  <text x="105" y="198" text-anchor="middle" font-size="13" fill="#412402">CRM</text>
  <rect x="75" y="380" width="60" height="46" rx="4" fill="#FAC775" stroke="#BA7517"/>
  <text x="105" y="408" text-anchor="middle" font-size="13" fill="#412402">ERP</text>
  <text x="145" y="530" font-size="12" fill="#555">Object: CSV files</text>
  <text x="145" y="550" font-size="12" fill="#555">Interface: file folders</text>

  <!-- Arrow to DW -->
  <path d="M240 340 H290" stroke="#7fb8e0" stroke-width="14"/>
  <polygon points="290,330 320,340 290,350" fill="#7fb8e0"/>

  <!-- Data Warehouse container -->
  <text x="700" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Data warehouse (SQL Server)</text>
  <rect x="330" y="130" width="740" height="430" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 3" rx="6"/>

  <!-- Bronze -->
  <rect x="355" y="170" width="210" height="350" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <rect x="355" y="170" width="210" height="40" rx="8" fill="#FAC775"/>
  <text x="460" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#412402">Bronze layer</text>
  <text x="460" y="230" text-anchor="middle" font-size="12" fill="#633806">Raw data</text>
  <text x="375" y="270" font-size="12" fill="#412402" font-weight="600">Object type:</text>
  <text x="375" y="288" font-size="12" fill="#633806">Tables</text>
  <text x="375" y="316" font-size="12" fill="#412402" font-weight="600">Load:</text>
  <text x="375" y="334" font-size="12" fill="#633806">Batch · full load</text>
  <text x="375" y="352" font-size="12" fill="#633806">Truncate &amp; insert</text>
  <text x="375" y="382" font-size="12" fill="#412402" font-weight="600">Transformations:</text>
  <text x="375" y="400" font-size="12" fill="#633806">None (as-is)</text>

  <!-- Silver -->
  <rect x="595" y="170" width="210" height="350" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <rect x="595" y="170" width="210" height="40" rx="8" fill="#D3D1C7"/>
  <text x="700" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#2C2C2A">Silver layer</text>
  <text x="700" y="230" text-anchor="middle" font-size="12" fill="#444441">Cleaned data</text>
  <text x="615" y="270" font-size="12" fill="#2C2C2A" font-weight="600">Object type:</text>
  <text x="615" y="288" font-size="12" fill="#444441">Tables</text>
  <text x="615" y="316" font-size="12" fill="#2C2C2A" font-weight="600">Transformations:</text>
  <text x="615" y="334" font-size="12" fill="#444441">Cleansing · standardize</text>
  <text x="615" y="352" font-size="12" fill="#444441">Normalize · enrich</text>
  <text x="615" y="382" font-size="12" fill="#2C2C2A" font-weight="600">Data model:</text>
  <text x="615" y="400" font-size="12" fill="#444441">None (as-is)</text>

  <!-- Gold -->
  <rect x="835" y="170" width="210" height="350" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <rect x="835" y="170" width="210" height="40" rx="8" fill="#FAC775"/>
  <text x="940" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#412402">Gold layer</text>
  <text x="940" y="230" text-anchor="middle" font-size="12" fill="#633806">Business-ready data</text>
  <text x="855" y="270" font-size="12" fill="#412402" font-weight="600">Object type:</text>
  <text x="855" y="288" font-size="12" fill="#633806">Views</text>
  <text x="855" y="316" font-size="12" fill="#412402" font-weight="600">Transformations:</text>
  <text x="855" y="334" font-size="12" fill="#633806">Integration · aggregation</text>
  <text x="855" y="352" font-size="12" fill="#633806">Business logic</text>
  <text x="855" y="382" font-size="12" fill="#412402" font-weight="600">Data model:</text>
  <text x="855" y="400" font-size="12" fill="#633806">Star schema</text>

  <!-- Arrows between layers -->
  <path d="M565 345 H590" stroke="#bbb" stroke-width="10"/>
  <polygon points="590,338 612,345 590,352" fill="#bbb"/>
  <path d="M805 345 H830" stroke="#bbb" stroke-width="10"/>
  <polygon points="830,338 852,345 830,352" fill="#bbb"/>

  <!-- Arrow to Consume -->
  <path d="M1070 340 H1120" stroke="#7fb8e0" stroke-width="14"/>
  <polygon points="1120,330 1150,340 1120,350" fill="#7fb8e0"/>

  <!-- Consume -->
  <text x="1260" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Consume</text>
  <rect x="1170" y="130" width="190" height="430" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 3" rx="6"/>
  <circle cx="1265" cy="220" r="28" fill="#CECBF6" stroke="#534AB7"/>
  <text x="1265" y="225" text-anchor="middle" font-size="11" fill="#26215C">BI</text>
  <circle cx="1265" cy="320" r="28" fill="#9FE1CB" stroke="#0F6E56"/>
  <text x="1265" y="318" text-anchor="middle" font-size="10" fill="#04342C">Ad-hoc</text>
  <text x="1265" y="332" text-anchor="middle" font-size="10" fill="#04342C">SQL</text>
  <circle cx="1265" cy="420" r="28" fill="#F0997B" stroke="#993C1D"/>
  <text x="1265" y="418" text-anchor="middle" font-size="10" fill="#4A1B0C">ML /</text>
  <text x="1265" y="430" text-anchor="middle" font-size="10" fill="#4A1B0C">analytics</text>
</svg>

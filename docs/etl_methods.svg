<svg width="1150" height="620" viewBox="0 0 1150 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1150" height="620" fill="#ffffff"/>
  <text x="575" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">ETL methods used in this project</text>

  <!-- Extract -->
  <rect x="60" y="100" width="320" height="460" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <rect x="60" y="100" width="320" height="44" rx="10" fill="#5DCAA5"/>
  <text x="220" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#04342C">Extract</text>
  <g font-size="13" fill="#04342C">
    <text x="85" y="175" font-weight="700">Method</text>
    <text x="100" y="195">Pull extraction (batch query)</text>
    <text x="85" y="230" font-weight="700">Type</text>
    <text x="100" y="250">Full extraction</text>
    <text x="85" y="285" font-weight="700">Technique</text>
    <text x="100" y="305">File parsing (CSV)</text>
    <text x="100" y="325">Database querying</text>
    <text x="85" y="365" font-weight="700">Source systems</text>
    <text x="100" y="385">CRM, ERP</text>
  </g>

  <!-- Transform -->
  <rect x="415" y="100" width="320" height="460" rx="10" fill="#FAECE7" stroke="#993C1D"/>
  <rect x="415" y="100" width="320" height="44" rx="10" fill="#F0997B"/>
  <text x="575" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#4A1B0C">Transform</text>
  <g font-size="13" fill="#4A1B0C">
    <text x="440" y="175" font-weight="700">Data cleansing</text>
    <text x="455" y="195">Remove duplicates</text>
    <text x="455" y="215">Handle missing / invalid values</text>
    <text x="455" y="235">Trim unwanted spaces</text>
    <text x="440" y="270" font-weight="700">Standardization</text>
    <text x="455" y="290">Normalize values &amp; types</text>
    <text x="440" y="325" font-weight="700">Enrichment</text>
    <text x="455" y="345">Derived columns</text>
    <text x="455" y="365">Business rules &amp; logic</text>
    <text x="440" y="400" font-weight="700">Integration</text>
    <text x="455" y="420">Join CRM + ERP sources</text>
    <text x="455" y="440">Aggregations</text>
  </g>

  <!-- Load -->
  <rect x="770" y="100" width="320" height="460" rx="10" fill="#E6F1FB" stroke="#185FA5"/>
  <rect x="770" y="100" width="320" height="44" rx="10" fill="#85B7EB"/>
  <text x="930" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#042C53">Load</text>
  <g font-size="13" fill="#042C53">
    <text x="795" y="175" font-weight="700">Processing type</text>
    <text x="810" y="195">Batch processing</text>
    <text x="795" y="230" font-weight="700">Load method</text>
    <text x="810" y="250">Full load — truncate &amp; insert</text>
    <text x="795" y="285" font-weight="700">Layer targets</text>
    <text x="810" y="305">Bronze → tables (raw)</text>
    <text x="810" y="325">Silver → tables (cleaned)</text>
    <text x="810" y="345">Gold → views (business-ready)</text>
    <text x="795" y="380" font-weight="700">Orchestration</text>
    <text x="810" y="400">Stored procedures</text>
    <text x="810" y="420">(proc_load_bronze / silver)</text>
  </g>

  <!-- arrows -->
  <path d="M380 330 H410" stroke="#999" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <path d="M735 330 H765" stroke="#999" stroke-width="2" fill="none" marker-end="url(#a2)"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#999" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
